name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the driver, judges, and lock code
        # all have win32-specific paths that a Linux-only matrix never runs.
        os: [ubuntu-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        if: runner.os == 'Linux'
        run: pnpm quality

      - name: Coverage
        if: runner.os == 'Linux'
        run: pnpm test:coverage

      - name: Lint, build and test (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm lint
          pnpm build
          pnpm test
