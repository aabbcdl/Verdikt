<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdikt 运行报告</title>
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --border: #dce3ec;
    --text: #172033;
    --text-dim: #647086;
    --text-bright: #101828;
    --green: #0b6f44;
    --red: #b42318;
    --yellow: #8a4f0f;
    --blue: #246bfd;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.55;
  }
  .app {
    width: min(980px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 56px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--blue);
    color: #ffffff;
    font-weight: 800;
  }
  h1, h2, h3, p { margin-top: 0; }
  h1 {
    margin-bottom: 4px;
    color: var(--text-bright);
    font-size: 23px;
    line-height: 1.2;
  }
  h2 {
    margin: 0 0 14px;
    color: var(--text-bright);
    font-size: 18px;
  }
  .subtitle {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .panel {
    margin-bottom: 14px;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 8px 28px rgba(30, 50, 80, 0.06);
  }
  .panel-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .panel-heading h2 { margin-bottom: 3px; }
  .panel-heading p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
  }
  .stat {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
  }
  .stat-label {
    margin-bottom: 5px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .stat-value {
    color: var(--text-bright);
    font-size: 17px;
    font-weight: 750;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .status-passed { color: var(--green); }
  .status-failed { color: var(--red); }
  .status-warning { color: var(--yellow); }
  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-ok { background: #e8f6ef; color: var(--green); }
  .badge-fail { background: #fff0ef; color: var(--red); }
  .badge-warning { background: #fff7e8; color: var(--yellow); }
  .badge-pending { background: #edf4ff; color: var(--blue); }
  .safety-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
  }
  .safety-item {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .safety-item span {
    display: block;
    margin-bottom: 4px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .file-list {
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .file-list + .file-list { margin-top: 5px; }
  .timeline {
    display: grid;
    gap: 10px;
  }
  .timeline-item {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .timeline-item.passed { border-color: #b8e2cb; }
  .timeline-item.failed { border-color: #f1c1bd; }
  .timeline-header {
    color: var(--text-bright);
    font-size: 14px;
    font-weight: 750;
  }
  .identifier { color: var(--text-dim); font-family: var(--mono); font-size: 11px; font-weight: 500; }
  .timeline-meta {
    margin-top: 4px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .feedback {
    margin-top: 9px;
    padding: 10px 12px;
    border: 1px solid #c8d7f5;
    border-radius: 9px;
    background: #f4f8ff;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .feedback.problem {
    border-color: #f1c1bd;
    background: #fff5f4;
  }
  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 10px;
  }
  .agent-box {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .agent-box strong {
    display: block;
    margin-bottom: 5px;
    color: var(--text-bright);
  }
  .empty {
    padding: 24px;
    color: var(--text-dim);
    text-align: center;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  th { color: var(--text-dim); font-size: 12px; font-weight: 650; }
  tr:last-child td { border-bottom: 0; }
  .patch-note {
    margin-top: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px;
  }
  .review-report { display: grid; gap: 10px; }
  .review-group { border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .review-group > strong { color: var(--text-bright); }
  .review-finding { padding: 12px 0; border-top: 1px solid var(--border); }
  .review-finding:first-of-type { border-top: 0; }
  .review-finding p { margin: 6px 0; }
  .review-hint { color: var(--text-dim); font-size: 12px; overflow-wrap: anywhere; }
  .severity {
    display: inline-block;
    padding: 3px 7px;
    margin-right: 7px;
    border-radius: 999px;
    background: #eef2f8;
    font-size: 11px;
    font-weight: 800;
  }
  .severity-critical, .severity-high { background: #fff0ef; color: #b83232; }
  .severity-medium { background: #fff7e8; color: #9b6515; }
  .severity-low { background: #edf4ff; color: #245fc2; }
  .verdict-page[hidden] { display: none; }
  .verdict-hero {
    margin-bottom: 18px;
    padding: 26px;
    border: 1px solid var(--border);
    border-left: 5px solid var(--blue);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 8px 28px rgba(30, 50, 80, 0.06);
  }
  .verdict-hero.pass { border-left-color: var(--green); }
  .verdict-hero.fail { border-left-color: var(--red); }
  .verdict-hero.needs_review { border-left-color: var(--yellow); }
  .verdict-hero.incomplete { border-left-color: var(--text-dim); }
  .verdict-status {
    margin-bottom: 8px;
    color: var(--blue);
    font-size: 30px;
    font-weight: 850;
    line-height: 1;
  }
  .verdict-hero.pass .verdict-status { color: var(--green); }
  .verdict-hero.fail .verdict-status { color: var(--red); }
  .verdict-hero.needs_review .verdict-status { color: var(--yellow); }
  .verdict-hero.incomplete .verdict-status { color: var(--text-dim); }
  .verdict-title {
    margin-bottom: 7px;
    font-size: 22px;
  }
  .verdict-summary {
    max-width: 720px;
    margin-bottom: 0;
    color: var(--text-dim);
  }
  .verdict-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }
  .action-button {
    min-height: 38px;
    padding: 8px 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .action-button.primary {
    border-color: var(--blue);
    background: var(--blue);
    color: #ffffff;
  }
  .verdict-section {
    margin-bottom: 18px;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .section-heading h2 { margin-bottom: 0; }
  .section-count {
    color: var(--text-dim);
    font-size: 12px;
  }
  .criteria-list { display: grid; }
  .criterion {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 13px 0;
    border-top: 1px solid var(--border);
  }
  .criterion:first-child { border-top: 0; }
  .criterion-mark {
    font-size: 17px;
    font-weight: 850;
    line-height: 1.35;
  }
  .criterion.pass .criterion-mark { color: var(--green); }
  .criterion.fail .criterion-mark { color: var(--red); }
  .criterion.needs_review .criterion-mark,
  .criterion.warning .criterion-mark { color: var(--yellow); }
  .criterion.skipped .criterion-mark { color: var(--text-dim); }
  .criterion-name {
    color: var(--text-bright);
    font-weight: 750;
  }
  .criterion-summary {
    margin-top: 3px;
    color: var(--text-dim);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .evidence-source {
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    text-align: right;
    white-space: nowrap;
  }
  .evidence-source.claimed { color: #8b6670; font-weight: 600; }
  .verdict-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .fact-list {
    display: grid;
    gap: 9px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .fact {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
  }
  .fact:last-child { padding-bottom: 0; border-bottom: 0; }
  .fact strong { color: var(--text-bright); text-align: right; }
  .change-list {
    display: grid;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .audit-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 18px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-bright);
    font: inherit;
    font-weight: 750;
    cursor: pointer;
  }
  .audit-list {
    display: grid;
    gap: 10px;
  }
  .audit-item {
    padding-bottom: 11px;
    border-bottom: 1px solid var(--border);
  }
  .audit-item:last-child { padding-bottom: 0; border-bottom: 0; }
  .audit-item.agent-claim { opacity: .68; }
  .audit-item-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--text-bright);
    font-size: 13px;
    font-weight: 750;
  }
  .audit-item p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  @media (max-width: 760px) {
    .app { width: min(100% - 20px, 980px); padding-top: 12px; }
    .panel { padding: 17px; }
    .grid, .safety-grid { grid-template-columns: 1fr 1fr; }
    .agent-grid { grid-template-columns: 1fr; }
    .verdict-columns { grid-template-columns: 1fr; }
  }
  @media (max-width: 460px) {
    .brand-mark { display: none; }
    h1 { font-size: 20px; }
    .grid, .safety-grid { grid-template-columns: 1fr; }
    .verdict-hero, .verdict-section { padding: 17px; }
    .verdict-status { font-size: 25px; }
    .criterion { grid-template-columns: 24px minmax(0, 1fr); }
    .evidence-source { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">V</div>
    <div>
      <h1>Verdikt 运行报告</h1>
      <p class="subtitle" id="run-id" role="status" aria-live="polite">正在读取运行记录...</p>
    </div>
  </header>

  <div class="verdict-page" id="verdict-page" hidden>
    <section class="verdict-hero" id="verdict-hero" aria-labelledby="verdict-title">
      <div class="verdict-status" id="verdict-status">INCOMPLETE</div>
      <h2 class="verdict-title" id="verdict-title">正在读取判定结果</h2>
      <p class="verdict-summary" id="verdict-summary"></p>
      <div class="verdict-actions">
        <button class="action-button" type="button" onclick="scrollToChanges()">查看修改</button>
        <button class="action-button primary" id="verdict-primary-action" type="button" onclick="returnToWorkbench()">返回工作台处理</button>
      </div>
    </section>

    <section class="verdict-section" aria-labelledby="criteria-title">
      <div class="section-heading">
        <h2 id="criteria-title">验收条件</h2>
        <span class="section-count" id="criteria-count"></span>
      </div>
      <div class="criteria-list" id="criteria-list"></div>
    </section>

    <div class="verdict-columns">
      <section class="verdict-section" aria-labelledby="scope-title">
        <h2 id="scope-title">修改范围</h2>
        <div class="fact-list" id="scope-info"></div>
      </section>
      <section class="verdict-section" aria-labelledby="integrity-title">
        <h2 id="integrity-title">完整性</h2>
        <div class="fact-list" id="integrity-info"></div>
      </section>
    </div>

    <section class="verdict-section" id="changes-panel" aria-labelledby="changes-title">
      <div class="section-heading">
        <h2 id="changes-title">修改文件</h2>
        <span class="section-count" id="changes-count"></span>
      </div>
      <div class="change-list" id="changes-list"></div>
    </section>

    <button class="audit-toggle" id="audit-toggle" type="button" aria-expanded="false" onclick="toggleAudit()">
      <span>查看证据与运行记录</span>
      <span aria-hidden="true">›</span>
    </button>
    <section class="verdict-section" id="audit-panel" aria-labelledby="audit-title" hidden>
      <h2 id="audit-title">证据与运行记录</h2>
      <div class="audit-list" id="audit-list"></div>
    </section>
  </div>

  <section class="panel" id="overview-panel" aria-labelledby="overview-title">
    <div class="panel-heading"><div><h2 id="overview-title">结果概览</h2><p>这次运行的结论、花费和补丁状态。</p></div></div>
    <div class="grid" id="status-grid"></div>
  </section>

  <section class="panel" id="review-panel" aria-labelledby="review-title" hidden>
    <div class="panel-heading"><div><h2 id="review-title">审查报告</h2><p>只读审查的发现，按严重程度排列。</p></div></div>
    <div class="review-report" id="review-report"></div>
  </section>

  <section class="panel" id="safety-panel" aria-labelledby="safety-title">
    <h2 id="safety-title">安全与完整性</h2>
    <div class="safety-grid" id="safety-info"></div>
  </section>

  <section class="panel" id="patch-panel" aria-labelledby="patch-title">
    <h2 id="patch-title">补丁</h2>
    <div id="patch-info"></div>
  </section>

  <section class="panel" id="iterations-panel" aria-labelledby="iterations-title">
    <h2 id="iterations-title">轮次详情</h2>
    <div id="iterations"></div>
  </section>

  <section class="panel" id="evidence-panel" aria-labelledby="evidence-title">
    <h2 id="evidence-title">证据文件</h2>
    <div class="table-wrap" id="evidence"></div>
  </section>
</main>

<script>
async function loadRun() {
  const params = new URLSearchParams(window.location.search);
  let basePath = params.get('dir') || '';
  let verdictPath = params.get('verdict') || '';

  if (!basePath) {
    document.getElementById('run-id').textContent = '请在地址中提供 ?dir=<运行目录>';
    document.getElementById('status-grid').innerHTML = '<div class="empty">没有指定运行目录，例如：?dir=.verdikt/run-xxx</div>';
    return;
  }

  basePath = basePath.replace(/\\/g, '/');

  let verdictRes = null;
  if (verdictPath) {
    try {
      verdictRes = await fetch(verdictPath);
    } catch {
      verdictRes = null;
    }
  }
  if (verdictRes && verdictRes.ok) {
    try {
      const verdict = await verdictRes.json();
      if (!isVerdictV1(verdict)) {
        renderVerdictError('判定结果格式无效或版本不受支持。');
        return;
      }
      renderVerdict(verdict, basePath);
      return;
    } catch {
      renderVerdictError('判定结果文件无法读取，不能确认这项修改是否通过。');
      return;
    }
  }
  if (verdictRes && verdictRes.status !== 404) {
    renderVerdictError(`判定结果读取失败（HTTP ${verdictRes.status}）。`);
    return;
  }
  if (verdictRes && verdictRes.status === 404) {
    const details = await verdictRes.json().catch(() => ({}));
    if (!details || details.legacy !== true) {
      renderVerdictError('Invalid or unavailable verdict result.');
      return;
    }
  }

  try {
    const summaryRes = await fetch(`${basePath}/summary.json`);
    if (!summaryRes.ok) throw new Error(`无法读取 ${basePath}/summary.json`);
    const summary = await summaryRes.json();

    let iterations = [];
    let iterationsAvailable = false;
    try {
      const iterRes = await fetch(`${basePath}/iterations.jsonl`);
      iterationsAvailable = iterRes.ok;
      if (iterRes.ok) {
        const text = await iterRes.text();
        iterations = text.trim().split('\n').filter(Boolean).map((line) => {
          try { return JSON.parse(line); } catch { return null; }
        }).filter(Boolean);
      }
    } catch {
      iterationsAvailable = false;
    }

    render(summary, iterations, basePath, { iterationsAvailable });
  } catch (err) {
    document.getElementById('run-id').textContent = `读取失败：${safeText(err && err.message, '无法读取运行记录')}`;
  }
}

function renderVerdict(verdict, basePath = '') {
  const status = safeText(verdict && verdict.status, 'incomplete');
  const summary = verdict && verdict.summary && typeof verdict.summary === 'object'
    ? verdict.summary
    : {};
  const run = verdict && verdict.run && typeof verdict.run === 'object' ? verdict.run : {};
  const criteria = Array.isArray(verdict && verdict.criteria) ? verdict.criteria : [];
  const evidence = Array.isArray(verdict && verdict.evidence) ? verdict.evidence : [];
  const scope = verdict && verdict.scope && typeof verdict.scope === 'object' ? verdict.scope : {};
  const integrity = verdict && verdict.integrity && typeof verdict.integrity === 'object'
    ? verdict.integrity
    : {};
  const evidenceById = new Map(evidence.map((item) => [safeText(item && item.id, ''), item]));

  document.getElementById('verdict-page').hidden = false;
  for (const id of [
    'overview-panel',
    'review-panel',
    'safety-panel',
    'patch-panel',
    'iterations-panel',
    'evidence-panel',
  ]) {
    document.getElementById(id).hidden = true;
  }

  document.getElementById('run-id').textContent = [
    safeText(run.runId, 'unknown'),
    safeText(run.taskId, ''),
    formatDate(verdict.createdAt),
  ].filter(Boolean).join(' · ');
  const hero = document.getElementById('verdict-hero');
  hero.className = `verdict-hero ${escapeHtml(status)}`;
  document.getElementById('verdict-status').textContent = verdictStatusLabel(status);
  document.getElementById('verdict-title').textContent = safeText(
    summary.title,
    '尚未形成可靠结论',
  );
  document.getElementById('verdict-summary').textContent = safeText(
    summary.explanation,
    'Verdikt 无法确认这项修改是否可以接受。',
  );

  const requiredPassed = safeNumber(summary.requiredPassed);
  const requiredTotal = safeNumber(summary.requiredTotal);
  document.getElementById('criteria-count').textContent =
    requiredTotal > 0 ? `${requiredPassed}/${requiredTotal} 项必需条件通过` : '没有可确认的必需条件';
  document.getElementById('criteria-list').innerHTML = criteria.length
    ? criteria.map((criterion) => renderCriterion(criterion, evidenceById)).join('')
    : '<div class="empty">没有可用的验收条件记录。</div>';

  const changedFiles = Array.isArray(scope.changedFiles) ? scope.changedFiles : [];
  const outOfScopeFiles = Array.isArray(scope.outOfScopeFiles) ? scope.outOfScopeFiles : [];
  document.getElementById('scope-info').innerHTML = [
    renderFact('范围检查', checkStatusLabel(scope.status)),
    renderFact('修改文件', String(safeNumber(scope.filesChanged) || changedFiles.length)),
    renderFact('越界修改', outOfScopeFiles.length ? `${outOfScopeFiles.length} 项` : '未发现'),
    renderFact(
      '改动行数',
      formatLineChanges(scope.linesAdded, scope.linesDeleted),
    ),
  ].join('');

  document.getElementById('integrity-info').innerHTML = [
    renderFact('完整性检查', checkStatusLabel(integrity.status)),
    renderFact('测试是否被修改', booleanFindingLabel(integrity.testsModified)),
    renderFact('验收是否被削弱', booleanFindingLabel(integrity.acceptanceWeakened)),
    renderFact('证据记录', integrity.evidenceRecorded ? '已记录' : '无法确认'),
  ].join('');

  document.getElementById('changes-count').textContent = `${changedFiles.length} 个文件`;
  document.getElementById('changes-list').innerHTML = changedFiles.length
    ? changedFiles.map((file) => `<div>${escapeHtml(file)}</div>`).join('')
    : '<div class="empty">没有记录到文件修改。</div>';

  const findings = Array.isArray(verdict && verdict.findings) ? verdict.findings : [];
  const auditItems = [
    ...evidence.map((item) => renderEvidenceItem(item)),
    ...findings.map((finding) => renderFindingItem(finding)),
  ];
  if (basePath) {
    auditItems.push(
      `<div class="audit-item"><div class="audit-item-title"><span>原始运行记录</span><span>文件</span></div><p>${escapeHtml(basePath)}/summary.json · ${escapeHtml(basePath)}/iterations.jsonl</p></div>`,
    );
  }
  document.getElementById('audit-list').innerHTML = auditItems.length
    ? auditItems.join('')
    : '<div class="empty">没有可展开的证据记录。</div>';
  document.getElementById('audit-panel').hidden = true;
  document.getElementById('audit-toggle').setAttribute?.('aria-expanded', 'false');

  const primaryAction = document.getElementById('verdict-primary-action');
  primaryAction.textContent = recommendationLabel(verdict.recommendation);
}

function renderVerdictError(message) {
  renderVerdict({
    version: 1,
    run: {
      runId: 'unknown',
      stopReason: 'provider_error',
      totalDurationMs: 0,
      usageStatus: 'unknown',
    },
    status: 'incomplete',
    summary: {
      title: '尚未形成可靠结论',
      explanation: message,
      requiredPassed: 0,
      requiredTotal: 0,
    },
    recommendation: 'none',
    scope: {
      status: 'skipped',
      expectedPaths: [],
      changedFiles: [],
      outOfScopeFiles: [],
      filesChanged: 0,
    },
    criteria: [],
    integrity: {
      status: 'skipped',
      testsModified: null,
      acceptanceWeakened: null,
      evidenceRecorded: false,
      criticalCount: 0,
      warningCount: 0,
      findings: [],
    },
    evidence: [],
    findings: [],
    provenance: {},
    createdAt: new Date().toISOString(),
  });
}

function renderCriterion(criterion, evidenceById) {
  const status = safeText(criterion && criterion.status, 'skipped');
  const evidenceIds = Array.isArray(criterion && criterion.evidenceIds)
    ? criterion.evidenceIds
    : [];
  const sourceEvidence = evidenceIds.map((id) => evidenceById.get(id)).find(Boolean);
  const source = sourceEvidence ? evidenceSourceLabel(sourceEvidence.source) : '无独立证据';
  const claimed = sourceEvidence && sourceEvidence.assurance === 'claimed' ? ' claimed' : '';
  return `
    <div class="criterion ${escapeHtml(status)}">
      <div class="criterion-mark" aria-hidden="true">${criterionMark(status)}</div>
      <div>
        <div class="criterion-name">${escapeHtml(criterion && criterion.name, '未命名条件')}</div>
        <div class="criterion-summary">${escapeHtml(criterion && criterion.summary, '没有结果摘要')}</div>
      </div>
      <div class="evidence-source${claimed}">${escapeHtml(source)}</div>
    </div>
  `;
}

function renderEvidenceItem(item) {
  const source = evidenceSourceLabel(item && item.source);
  const assurance = evidenceAssuranceLabel(item && item.assurance);
  const claimClass = item && item.source === 'agent_claim' ? ' agent-claim' : '';
  return `
    <div class="audit-item${claimClass}">
      <div class="audit-item-title">
        <span>${escapeHtml(item && item.title, '未命名证据')}</span>
        <span>${escapeHtml(source)} · ${escapeHtml(assurance)}</span>
      </div>
      <p>${escapeHtml(item && item.summary, '没有摘要')}</p>
    </div>
  `;
}

function renderFindingItem(finding) {
  return `
    <div class="audit-item">
      <div class="audit-item-title">
        <span>${escapeHtml(finding && finding.title, '审查发现')}</span>
        <span>${escapeHtml(finding && finding.severity, '')}</span>
      </div>
      <p>${escapeHtml(finding && finding.detail, '没有详情')}</p>
    </div>
  `;
}

function renderFact(label, value) {
  return `<div class="fact"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
}

function toggleAudit() {
  const panel = document.getElementById('audit-panel');
  const toggle = document.getElementById('audit-toggle');
  panel.hidden = !panel.hidden;
  toggle.setAttribute?.('aria-expanded', panel.hidden ? 'false' : 'true');
}

function scrollToChanges() {
  document.getElementById('changes-panel').scrollIntoView?.({ behavior: 'smooth', block: 'start' });
}

function returnToWorkbench() {
  if (window.location && String(window.location.pathname || '').startsWith('/view/')) {
    window.location.assign('/');
    return;
  }
  if (window.history && window.history.length > 1) window.history.back();
}

function isVerdictV1(value) {
  const structural = Boolean(
    value &&
    value.version === 1 &&
    ['pass', 'fail', 'needs_review', 'incomplete'].includes(value.status) &&
    value.run &&
    value.summary &&
    Array.isArray(value.criteria) &&
    Array.isArray(value.evidence),
  );
  if (!structural) return false;
  if (value.status !== 'pass') return true;
  const criteria = Array.isArray(value.criteria) ? value.criteria : [];
  const required = criteria.filter((criterion) => criterion && criterion.required === true);
  const evidenceIds = new Set((value.evidence || []).map((evidence) => evidence && evidence.id));
  return Boolean(
    value.recommendation === 'accept_change' &&
    required.length > 0 &&
    required.every((criterion) => criterion.status === 'pass' &&
      Array.isArray(criterion.evidenceIds) && criterion.evidenceIds.length > 0 &&
      criterion.evidenceIds.every((id) => evidenceIds.has(id))) &&
    value.integrity && value.integrity.status === 'pass' &&
    value.integrity.evidenceRecorded === true &&
    value.integrity.criticalCount === 0,
  );
}

function verdictStatusLabel(status) {
  const labels = {
    pass: 'PASS',
    fail: 'FAIL',
    needs_review: 'NEEDS REVIEW',
    incomplete: 'INCOMPLETE',
  };
  return labels[status] || 'INCOMPLETE';
}

function criterionMark(status) {
  const labels = {
    pass: '✓',
    fail: '×',
    needs_review: '!',
    warning: '!',
    skipped: '–',
  };
  return labels[status] || '–';
}

function checkStatusLabel(status) {
  const labels = {
    pass: '通过',
    fail: '未通过',
    needs_review: '需要判断',
    warning: '有提醒',
    skipped: '未设置',
  };
  return labels[status] || '无法确认';
}

function evidenceSourceLabel(source) {
  const labels = {
    verified_execution: '真实执行',
    diff_inspection: '差异检查',
    independent_review: '独立审查',
    agent_claim: 'Agent 自述',
    user_confirmation: '用户确认',
  };
  return labels[source] || '来源未知';
}

function evidenceAssuranceLabel(assurance) {
  const labels = {
    verified: '已验证',
    attested: '已确认',
    claimed: '仅为声明',
  };
  return labels[assurance] || '无法确认';
}

function recommendationLabel(recommendation) {
  const labels = {
    accept_change: '返回工作台应用修改',
    continue_fixing: '返回工作台继续修复',
    human_review: '返回工作台处理',
    discard: '返回工作台丢弃',
    none: '返回工作台',
  };
  return labels[recommendation] || '返回工作台';
}

function booleanFindingLabel(value) {
  if (value === true) return '是';
  if (value === false) return '否';
  return '无法确认';
}

function formatLineChanges(added, deleted) {
  const hasAdded = typeof added === 'number' && Number.isFinite(added);
  const hasDeleted = typeof deleted === 'number' && Number.isFinite(deleted);
  if (!hasAdded && !hasDeleted) return '未记录';
  return `+${hasAdded ? added : 0} / -${hasDeleted ? deleted : 0}`;
}

function render(summary, iterations, basePath, options = {}) {
  const status = safeText(summary.status || summary.stopReason, 'unknown');
  const reviewOnly = summary.reviewOnly === true || status === 'review_completed' || status === 'review_incomplete';
  const passed = status === 'passed';
  const statusClass = passed || status === 'review_completed'
    ? 'status-passed'
    : isWarningStatus(status)
      ? 'status-warning'
      : 'status-failed';
  const savedIterations = Array.isArray(summary.iterations) && summary.iterations.length > 0
    ? summary.iterations
    : (Array.isArray(iterations) ? iterations : []);
  const partialIteration = summary.partialIteration && typeof summary.partialIteration === 'object'
    ? summary.partialIteration
    : null;
  const runIterations = partialIteration && !savedIterations.some((item) => item && item.index === partialIteration.index)
    ? [...savedIterations, partialIteration]
    : savedIterations;

  document.getElementById('run-id').innerHTML =
    `<span class="${statusClass}">${escapeHtml(summary.runId, 'unknown')}</span> · ${escapeHtml(summary.taskId, '')} · ${escapeHtml(formatDate(summary.timestamp), '')}`;

  const report = summary.reviewReport && typeof summary.reviewReport === 'object' ? summary.reviewReport : null;
  const findingsCount = report && Array.isArray(report.findings) ? report.findings.length : 0;
  const lastStat = reviewOnly
    ? `<div class="stat"><div class="stat-label">发现问题</div><div class="stat-value">${findingsCount}</div></div>`
    : `<div class="stat"><div class="stat-label">补丁状态</div><div class="stat-value"><span class="badge badge-${applyBadge(summary.applyStatus)}">${escapeHtml(applyStatusLabel(summary.applyStatus))}</span></div></div>`;
  document.getElementById('status-grid').innerHTML = `
    <div class="stat"><div class="stat-label">状态</div><div class="stat-value ${statusClass}">${escapeHtml(statusLabel(status))}</div></div>
    <div class="stat"><div class="stat-label">轮次（Iterations）</div><div class="stat-value">${runIterations.length}</div></div>
    <div class="stat"><div class="stat-label">花费</div><div class="stat-value">${formatCost(summary, 2, 'totalCostUsd')}</div></div>
    <div class="stat"><div class="stat-label">耗时</div><div class="stat-value">${formatDuration(summary.totalDurationMs)}</div></div>
    ${lastStat}
  `;

  if (reviewOnly) {
    document.getElementById('safety-panel').hidden = true;
    document.getElementById('patch-panel').hidden = true;
    renderReviewPanel(report);
  }

  const ws = summary.workspace || {};
  const integ = summary.integrity || {};
  const criticalCount = safeNumber(integ.criticalCount);
  document.getElementById('safety-info').innerHTML = `
    <div class="safety-item"><span>工作区</span><strong>${escapeHtml(workspaceLabel(ws.mode))}</strong></div>
    <div class="safety-item"><span>应用前原项目</span><strong>${ws.originalRepoCleanBeforeApply ? '干净' : '有未提交改动或状态未知'}</strong></div>
    <div class="safety-item"><span>完整性</span><strong><span class="badge badge-${safeText(integ.status) === 'ok' ? 'ok' : 'fail'}">${escapeHtml(integrityLabel(integ.status))}</span></strong></div>
    <div class="safety-item"><span>关键风险</span><strong>${criticalCount > 0 ? `<span class="badge badge-fail">${criticalCount} 项</span>` : '<span class="badge badge-ok">未发现</span>'}</strong></div>
  `;

  const patchInfo = document.getElementById('patch-info');
  const patch = summary.patch;
  if (patch) {
    const allFiles = uniqueFiles(runIterations.flatMap((item) => iterationFiles(item)));
    const filesChanged = safeNumber(patch.filesChanged) || allFiles.length;
    patchInfo.innerHTML = `
      <div class="grid">
        <div class="stat"><div class="stat-label">修改文件</div><div class="stat-value">${filesChanged}</div></div>
        <div class="stat"><div class="stat-label">补丁文件</div><div class="stat-value">${safeText(patch.finalPatchPath, '') ? '已保存' : '无'}</div></div>
      </div>
      <div style="margin-top:12px">${allFiles.length ? allFiles.map((file) => `<div class="file-list">${escapeHtml(file)}</div>`).join('') : '<div class="empty">没有记录到文件改动</div>'}</div>
    `;
  } else {
    patchInfo.innerHTML = '<div class="empty">没有补丁数据</div>';
  }

  const iterDiv = document.getElementById('iterations');
  if (runIterations.length === 0) {
    iterDiv.innerHTML = reviewOnly
      ? '<div class="empty">只读审查，没有修改轮次。</div>'
      : '<div class="empty">没有记录到运行轮次</div>';
  } else {
    iterDiv.innerHTML = '<div class="timeline">' + runIterations.map((item, index) => {
      const judgePassed = Boolean(item && item.judge && item.judge.passed);
      const judgeClass = judgePassed ? 'passed' : 'failed';
      const verifier = (item && (item.verifier || item.verifierVerdict)) || {};
      const problems = Array.isArray(verifier.problems) ? verifier.problems : [];
      const changedFiles = iterationFiles(item);
      return `
        <article class="timeline-item ${judgeClass}">
          <div class="timeline-header">第 ${index + 1} 轮 <span class="identifier">Round ${index + 1}</span></div>
          <div class="timeline-meta">
            ${formatDuration(item && item.durationMs)} · ${formatCost(item, 4, 'costUsd')} ·
            验收：<span class="badge badge-${judgePassed ? 'ok' : 'fail'}">${escapeHtml(localizeJudgeSummary(item && item.judge && item.judge.summary) || (judgePassed ? '已通过' : '未通过'), judgePassed ? '已通过' : '未通过')}</span>
            ${item && item.integrity ? ` · 完整性：<span class="badge badge-${safeText(item.integrity.status) === 'ok' ? 'ok' : 'fail'}">${escapeHtml(integrityLabel(item.integrity.status))}</span>` : ''}
          </div>
          ${safeText(verifier.nextInstruction, '') ? `<div class="feedback"><strong>下一步：</strong>${escapeHtml(verifier.nextInstruction)}</div>` : ''}
          ${problems.length ? `<div class="feedback problem"><strong>发现的问题：</strong><br>${problems.map((problem) => escapeHtml(problem)).join('<br>')}</div>` : ''}
          <div class="agent-grid">
            <div class="agent-box"><strong>执行结果</strong>${escapeHtml(executorText(item))}</div>
            <div class="agent-box"><strong>审查结论</strong>${escapeHtml(verifierText(verifier, problems))}</div>
          </div>
          ${changedFiles.length ? `<div style="margin-top:10px">${changedFiles.map((file) => `<div class="file-list">${escapeHtml(file)}</div>`).join('')}</div>` : ''}
        </article>
      `;
    }).join('') + '</div>';
  }

  const iterationsAvailable = options.iterationsAvailable !== false;
  const evidenceRows = [
    `<tr><td>summary.json</td><td class="file-list">${escapeHtml(basePath)}/summary.json</td></tr>`,
    iterationsAvailable ? `<tr><td>iterations.jsonl</td><td class="file-list">${escapeHtml(basePath)}/iterations.jsonl</td></tr>` : '',
    patch && safeText(patch.finalPatchPath, '') ? `<tr><td>final.patch</td><td class="file-list">${escapeHtml(patch.finalPatchPath)}</td></tr>` : '',
  ].join('');
  document.getElementById('evidence').innerHTML = `
    <table>
      <thead><tr><th>文件</th><th>路径</th></tr></thead>
      <tbody>${evidenceRows}</tbody>
    </table>
    ${patch && safeText(patch.finalPatchPath, '') ? '<div class="patch-note">可回到主工作台查看补丁内容，并决定应用或丢弃。</div>' : ''}
  `;
}

function executorText(iteration) {
  const raw = safeText(iteration && iteration.executorOutput, '');
  if (raw) return raw.slice(0, 600);
  const files = iterationFiles(iteration);
  return files.length ? `修改了 ${files.length} 个文件：${files.join(', ')}` : '摘要中没有执行输出。';
}

function verifierText(verifier, problems) {
  if (problems.length > 0) return problems.join('\n');
  if (safeText(verifier.nextInstruction, '')) return verifier.nextInstruction;
  return verifier.done ? '审查已确认本轮完成。' : '摘要中没有审查文字。';
}

function uniqueFiles(files) {
  return [...new Set(files.map((file) => safeText(file, '')).filter(Boolean))];
}

function fileList(value) {
  return Array.isArray(value) ? value : [];
}

function iterationFiles(iteration) {
  return fileList(iteration && iteration.patch && iteration.patch.filesChanged).length
    ? fileList(iteration.patch.filesChanged)
    : fileList(iteration && iteration.changedFiles);
}

function statusLabel(status) {
  const labels = {
    passed: '已通过',
    cancelled: '已停止',
    interrupted: '已中断，可继续',
    resumable: '可继续',
    review_completed: '审查完成',
    review_incomplete: '审查未完成',
    max_iterations: '达到轮数上限',
    budget_exceeded: '预算已用完',
    no_progress: '没有进展',
    stage_failed: '阶段未通过',
    approval_rejected: '确认已拒绝',
    provider_error: '服务请求未完成',
    error: '运行错误',
  };
  return labels[status] || status || '未知';
}

function localizeJudgeSummary(text) {
  const value = safeText(text, '');
  const match = value.match(/^(\d+)\/(\d+) required (passed|failed)$/);
  if (!match) return value;
  return `必需 ${match[1]}/${match[2]} ${match[3] === 'passed' ? '通过' : '未通过'}`;
}

function renderReviewPanel(report) {
  const panel = document.getElementById('review-panel');
  const container = document.getElementById('review-report');
  if (!panel || !container) return;
  panel.hidden = false;
  const findings = report && Array.isArray(report.findings) ? report.findings : [];
  const summaryText = safeText(report && report.summary, '');
  if (findings.length === 0) {
    const title = report && report.verdict === 'incomplete' ? '没有形成可用结论' : '没有发现明确问题';
    container.innerHTML = `<div class="review-group"><strong>${title}</strong><p class="review-hint">${escapeHtml(summaryText, '')}</p></div>`;
    return;
  }
  const order = ['critical', 'high', 'medium', 'low'];
  const labels = { critical: '严重', high: '高', medium: '一般', low: '建议' };
  const groups = order.map((severity) => {
    const items = findings.filter((item) => item && item.severity === severity);
    if (!items.length) return '';
    const rows = items.map((item) => `
      <div class="review-finding">
        <div><span class="severity severity-${severity}">${labels[severity]}</span><strong>${escapeHtml(item.title, '')}</strong></div>
        <p>${escapeHtml(item.detail, '')}</p>
        ${safeText(item.file, '') ? `<div class="review-hint">${escapeHtml(item.file)}${item.line ? ':' + escapeHtml(String(item.line)) : ''}</div>` : ''}
        <div class="review-hint">建议：${escapeHtml(item.recommendation, '')}</div>
      </div>
    `).join('');
    return `<div class="review-group"><strong>${labels[severity]}问题 · ${items.length}</strong>${rows}</div>`;
  }).join('');
  container.innerHTML = (summaryText ? `<p class="review-hint">${escapeHtml(summaryText)}</p>` : '') + groups;
}

function isWarningStatus(status) {
  return ['cancelled', 'interrupted', 'resumable', 'review_incomplete', 'max_iterations', 'budget_exceeded', 'no_progress'].includes(status);
}

function applyStatusLabel(status) {
  const labels = { applied: '已应用', discarded: '已丢弃', pending: '等待决定' };
  return labels[status] || status || '等待决定';
}

function workspaceLabel(mode) {
  // "direct" is the actual non-isolated mode value; "in_place" never existed.
  const labels = { isolated: '隔离副本', direct: '直接模式', review: '只读审查' };
  return labels[mode] || mode || '未知';
}

function integrityLabel(status) {
  const labels = { ok: '通过', failed: '未通过', unknown: '未知' };
  return labels[status] || status || '未知';
}

function formatDate(value) {
  const text = safeText(value, '');
  if (!text) return '';
  const date = new Date(text);
  return Number.isNaN(date.getTime()) ? text : date.toLocaleString('zh-CN');
}

function formatDuration(ms) {
  const value = safeNumber(ms);
  if (value <= 0) return '-';
  if (value < 1000) return `${value}ms`;
  if (value < 60000) return `${(value / 1000).toFixed(1)}s`;
  return `${(value / 60000).toFixed(1)}m`;
}

function applyBadge(status) {
  if (status === 'applied') return 'ok';
  if (status === 'discarded') return 'fail';
  return 'pending';
}

function safeText(value, fallback = '-') {
  if (typeof value === 'string' && value.length > 0) return value;
  if (typeof value === 'number' && Number.isFinite(value)) return String(value);
  return fallback;
}

function formatCost(value, digits = 2, field = 'totalCostUsd') {
  const status = value && value.usage && typeof value.usage.status === 'string'
    ? value.usage.status
    : value && typeof value.usageStatus === 'string'
      ? value.usageStatus
      : value && typeof value[field] === 'number'
        ? 'complete'
        : 'unknown';
  if (status === 'unknown' || !value || typeof value[field] !== 'number') return '未知';
  const text = '$' + value[field].toFixed(digits);
  return status === 'partial' ? text + '+' : text;
}

function safeNumber(value) {
  return typeof value === 'number' && Number.isFinite(value) ? value : 0;
}

function escapeHtml(value, fallback = '-') {
  return safeText(value, fallback)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

loadRun();
</script>
